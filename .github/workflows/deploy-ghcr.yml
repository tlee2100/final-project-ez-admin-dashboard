name: Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: 'API URL with /api/v1, e.g. https://ez-chatbot-api.xxx.azurecontainerapps.io/api/v1'
        required: true
      next_public_chat_widget_url:
        description: 'Widget URL, e.g. https://ez-chat-widget.xxx.azurecontainerapps.io'
        required: true
      next_public_widget_script_url:
        description: 'Widget script URL, e.g. https://ez-chat-widget.xxx.azurecontainerapps.io/ez-chat-widget.js'
        required: true
      next_public_widget_version:
        description: 'Widget cache-busting version'
        required: false
        default: '1.0.0'
      tag:
        description: 'Custom image tag (in addition to latest)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NEXT_PUBLIC_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:${{ inputs.tag }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.next_public_api_url || vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CHAT_WIDGET_URL=${{ inputs.next_public_chat_widget_url || vars.NEXT_PUBLIC_CHAT_WIDGET_URL }}
            NEXT_PUBLIC_WIDGET_SCRIPT_URL=${{ inputs.next_public_widget_script_url || vars.NEXT_PUBLIC_WIDGET_SCRIPT_URL }}
            NEXT_PUBLIC_WIDGET_VERSION=${{ inputs.next_public_widget_version || vars.NEXT_PUBLIC_WIDGET_VERSION || '1.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
